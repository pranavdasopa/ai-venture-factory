<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1"
>

<title>SAI — Sahayak AI</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
background:#050505;
color:#fff;
font-family:Arial,sans-serif;
}

.app{
max-width:1200px;
margin:auto;
padding:30px;
}

header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:60px;
}

.logo{
font-size:28px;
font-weight:bold;
}

.status{
color:#62ff91;
font-size:13px;
}

.hero h1{
font-size:56px;
letter-spacing:-3px;
margin:0;
}

.hero p{
color:#888;
font-size:18px;
}

.grid{
display:grid;
grid-template-columns:2fr 1fr;
gap:20px;
margin-top:40px;
}

.card{
background:#101010;
border:1px solid #252525;
border-radius:24px;
padding:25px;
}

.full{
grid-column:1/-1;
}

input,
textarea{
width:100%;
background:#080808;
color:#fff;
border:1px solid #333;
border-radius:14px;
padding:15px;
font-size:16px;
outline:none;
margin-top:8px;
}

textarea{
height:120px;
resize:vertical;
}

button{
border:0;
border-radius:12px;
padding:13px 20px;
margin-top:12px;
cursor:pointer;
font-weight:bold;
}

.primary{
background:#fff;
color:#000;
}

.secondary{
background:#242424;
color:#fff;
}

.result{
margin-top:18px;
background:#080808;
padding:18px;
border-radius:14px;
white-space:pre-wrap;
line-height:1.6;
min-height:60px;
}

.goal,
.opportunity{
background:#080808;
border:1px solid #222;
border-radius:14px;
padding:16px;
margin-top:10px;
}

.profile{
display:grid;
gap:10px;
}

.muted{
color:#888;
}

.score{
margin-top:8px;
font-weight:bold;
}

@media(max-width:800px){

.grid{
grid-template-columns:1fr;
}

.full{
grid-column:auto;
}

.hero h1{
font-size:40px;
}

}

</style>

</head>


<body>

<div class="app">


<header>

<div class="logo">
SAI
</div>

<div class="status">
● AI ONLINE
</div>

</header>


<section class="hero">

<h1>
Your personal AI agent.
</h1>

<p>
Learn. Build. Discover. Execute.
</p>

</section>


<div class="grid">


<!-- ================= PROFILE ================= -->

<div class="card">

<h2>Your Profile</h2>

<div class="profile">

<input
id="profileName"
placeholder="Your name"
>

<input
id="profileEmail"
type="email"
placeholder="Your email"
>

<input
id="profileGoal"
placeholder="Your main goal"
>

<input
id="profileSkills"
placeholder="Skills, separated by commas"
>

<button
class="primary"
onclick="saveProfile()"
>

Save Profile

</button>

<div
class="result"
id="profileResult"
>

Create your profile so SAI can personalize your experience.

</div>

</div>

</div>


<!-- ================= GOALS ================= -->

<div class="card">

<h2>Your Goals</h2>

<input
id="goalInput"
placeholder="Add a goal..."
>

<button
class="secondary"
onclick="addGoal()"
>

Add Goal

</button>

<div id="goals">
Loading...
</div>

</div>


<!-- ================= CHAT ================= -->

<div class="card full">

<h2>
Talk to SAI
</h2>

<textarea
id="message"
placeholder="Tell SAI what you want to accomplish..."
></textarea>

<button
class="primary"
onclick="askSAI()"
>

Ask SAI

</button>

<div
class="result"
id="chatResult"
>

SAI is ready.

</div>

</div>


<!-- ================= OPPORTUNITIES ================= -->

<div class="card full">

<h2>
Opportunity Engine
</h2>

<p class="muted">
Find opportunities matching your interests and skills.
</p>

<input
id="opportunitySearch"
placeholder="Python, AI, internship..."
>

<button
class="primary"
onclick="searchOpportunities()"
>

Find Opportunities

</button>

<div
id="opportunities"
>

</div>

</div>


</div>

</div>


<script>


// ==========================================
// PROFILE
// ==========================================

async function saveProfile(){

const name =
document
.getElementById("profileName")
.value
.trim();

const email =
document
.getElementById("profileEmail")
.value
.trim();

const goal =
document
.getElementById("profileGoal")
.value
.trim();

const skills =
document
.getElementById("profileSkills")
.value
.trim();

const output =
document
.getElementById("profileResult");


if(!name || !email){

output.textContent =
"Name and email are required.";

return;

}


output.textContent =
"Saving profile...";


try{

const response =
await fetch(
"/api/profile",
{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
name:name,
email:email,
goal:goal,
skills:skills
})
}
);


const data =
await response.json();


if(!data.success){

throw new Error(
data.error
);

}


localStorage.setItem(
"sai_user_id",
String(data.user_id)
);


output.textContent =
"Profile saved. SAI can now personalize your opportunities.";

await loadPersonalizedOpportunities();


}catch(error){

output.textContent =
"Error: " + error.message;

}

}


// ==========================================
// LOAD SAVED PROFILE
// ==========================================

async function loadProfile(){

const userId =
localStorage.getItem(
"sai_user_id"
);


if(!userId){

return;

}


try{

const response =
await fetch(
"/api/profile/" + userId
);


const data =
await response.json();


if(!data.success){

localStorage.removeItem(
"sai_user_id"
);

return;

}


const profile =
data.profile;


document
.getElementById("profileName")
.value =
profile.name || "";


document
.getElementById("profileEmail")
.value =
profile.email || "";


document
.getElementById("profileGoal")
.value =
profile.goal || "";


document
.getElementById("profileSkills")
.value =
profile.skills || "";


document
.getElementById("profileResult")
.textContent =
"Profile loaded.";


}catch(error){

console.log(
"Profile load error:",
error
);

}

}


// ==========================================
// SAI CHAT
// ==========================================

async function askSAI(){

const message =
document
.getElementById("message")
.value
.trim();

const output =
document
.getElementById("chatResult");


if(!message){

output.textContent =
"Tell SAI what you want to accomplish.";

return;

}


output.textContent =
"SAI is thinking...";


try{

const response =
await fetch(
"/api/chat",
{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
message:message
})
}
);


const data =
await response.json();


if(!data.success){

throw new Error(
data.error
);

}


output.textContent =
data.response;


}catch(error){

output.textContent =
"Error: " + error.message;

}

}


// ==========================================
// GOALS
// ==========================================

async function loadGoals(){

const container =
document.getElementById(
"goals"
);


try{

const response =
await fetch(
"/api/goals"
);


const data =
await response.json();


if(!data.success){

throw new Error(
data.error
);

}


container.innerHTML = "";


if(data.goals.length === 0){

container.innerHTML =
'<div class="muted">No goals yet.</div>';

return;

}


data.goals.forEach(
goal => {

const div =
document.createElement(
"div"
);

div.className =
"goal";

div.textContent =
"🎯 " + goal.title;

container.appendChild(
div
);

});

}catch(error){

container.textContent =
"Could not load goals.";

}

}


async function addGoal(){

const input =
document.getElementById(
"goalInput"
);

const goal =
input.value.trim();


if(!goal){

return;

}


try{

const response =
await fetch(
"/api/goals",
{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
goal:goal
})
}
);


const data =
await response.json();


if(!data.success){

throw new Error(
data.error
);

}


input.value = "";

await loadGoals();


}catch(error){

alert(
"Could not save goal: "
+ error.message
);

}

}


// ==========================================
// OPPORTUNITY SEARCH
// ==========================================

async function searchOpportunities(){

const query =
document
.getElementById(
"opportunitySearch"
)
.value
.trim();


const userId =
localStorage.getItem(
"sai_user_id"
);


const container =
document.getElementById(
"opportunities"
);


container.textContent =
"Searching...";


try{

let url =
"/api/opportunities";


if(query){

url +=
"?q=" +
encodeURIComponent(
query
);

}else if(userId){

url +=
"?user_id=" +
encodeURIComponent(
userId
);

}


const response =
await fetch(
url
);


const data =
await response.json();


if(!data.success){

throw new Error(
data.error
);

}


container.innerHTML = "";


if(data.opportunities.length === 0){

container.textContent =
"No matching opportunities.";

return;

}


data.opportunities.forEach(
item => {

const div =
document.createElement(
"div"
);

div.className =
"opportunity";


let html =
"<h3>" +
safe(item.title) +
"</h3>";


html +=
"<div class='muted'>" +
safe(item.company) +
"</div>";


html +=
"<p>" +
safe(item.type) +
" · " +
safe(item.location) +
"</p>";


html +=
"<div class='muted'>" +
safe(item.skills.join(", ")) +
"</div>";


if(
item.match_score !== undefined
){

html +=
"<div class='score'>" +
"Match score: " +
safe(item.match_score) +
"</div>";

}


if(
item.matched_skills &&
item.matched_skills.length
){

html +=
"<div class='muted'>" +
"Matched skills: " +
safe(
item.matched_skills.join(", ")
) +
"</div>";

}


div.innerHTML =
html;


container.appendChild(
div
);

});


}catch(error){

container.textContent =
"Search error: " +
error.message;

}

}


// ==========================================
// PERSONALIZED OPPORTUNITIES
// ==========================================

async function loadPersonalizedOpportunities(){

const userId =
localStorage.getItem(
"sai_user_id"
);


if(!userId){

return;

}


const container =
document.getElementById(
"opportunities"
);


container.textContent =
"Personalizing opportunities...";


try{

const response =
await fetch(
"/api/opportunities?user_id=" +
encodeURIComponent(
userId
)
);


const data =
await response.json();


if(!data.success){

throw new Error(
data.error
);

}


container.innerHTML = "";


data.opportunities.forEach(
item => {

const div =
document.createElement(
"div"
);

div.className =
"opportunity";


let html =
"<h3>" +
safe(item.title) +
"</h3>" +

"<div class='muted'>" +
safe(item.company) +
"</div>" +

"<p>" +
safe(item.type) +
" · " +
safe(item.location) +
"</p>" +

"<div class='muted'>" +
safe(item.skills.join(", ")) +
"</div>";


if(
item.match_score !== undefined
){

html +=
"<div class='score'>" +
"Match score: " +
safe(item.match_score) +
"</div>";

}


if(
item.matched_skills &&
item.matched_skills.length
){

html +=
"<div class='muted'>" +
"Matched skills: " +
safe(
item.matched_skills.join(", ")
) +
"</div>";

}


div.innerHTML =
html;

container.appendChild(
div
);

});

}catch(error){

container.textContent =
"Could not load personalized opportunities.";

}

}


// ==========================================
// SECURITY HELPER
// ==========================================

function safe(value){

return String(value)

.replaceAll(
"&",
"&amp;"
)

.replaceAll(
"<",
"&lt;"
)

.replaceAll(
">",
"&gt;"
)

.replaceAll(
'"',
"&quot;"
)

.replaceAll(
"'",
"&#039;"
);

}


// ==========================================
// INITIALIZE
// ==========================================

loadProfile();

loadGoals();

loadPersonalizedOpportunities();


</script>

</body>

</html>
