<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1"
>

<title>SAI — Sahayak AI</title>

<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    background: #050505;

    color: #ffffff;

    font-family:
        Arial,
        Helvetica,
        sans-serif;
}

.app {

    max-width: 1200px;

    margin: auto;

    padding: 30px;
}

header {

    display: flex;

    justify-content: space-between;

    align-items: center;

    margin-bottom: 60px;
}

.logo {

    font-size: 28px;

    font-weight: bold;

    letter-spacing: -1px;
}

.status {

    color: #62ff91;

    font-size: 13px;
}

.hero h1 {

    font-size: 56px;

    letter-spacing: -3px;

    margin: 0;
}

.hero p {

    color: #888;

    font-size: 18px;
}

.grid {

    display: grid;

    grid-template-columns:
        2fr 1fr;

    gap: 20px;

    margin-top: 40px;
}

.card {

    background: #101010;

    border: 1px solid #252525;

    border-radius: 24px;

    padding: 25px;
}

.full {

    grid-column: 1 / -1;
}

input,
textarea {

    width: 100%;

    background: #080808;

    color: #ffffff;

    border: 1px solid #333;

    border-radius: 14px;

    padding: 15px;

    font-size: 16px;

    outline: none;
}

input:focus,
textarea:focus {

    border-color: #666;
}

textarea {

    height: 120px;

    resize: vertical;
}

button {

    border: 0;

    border-radius: 12px;

    padding: 13px 20px;

    margin-top: 12px;

    cursor: pointer;

    font-weight: bold;
}

button:disabled {

    opacity: 0.5;

    cursor: not-allowed;
}

.primary {

    background: #ffffff;

    color: #000000;
}

.secondary {

    background: #242424;

    color: #ffffff;
}

.result {

    margin-top: 18px;

    background: #080808;

    padding: 18px;

    border-radius: 14px;

    white-space: pre-wrap;

    line-height: 1.6;

    min-height: 60px;
}

.goal,
.opportunity {

    background: #080808;

    border: 1px solid #222;

    border-radius: 14px;

    padding: 16px;

    margin-top: 10px;
}

.opportunity h3 {

    margin-top: 0;

    margin-bottom: 8px;
}

.muted {

    color: #888;
}

.badge {

    display: inline-block;

    padding: 5px 9px;

    margin: 4px 4px 0 0;

    border-radius: 999px;

    background: #1d1d1d;

    color: #bbb;

    font-size: 12px;
}

.match {

    margin-top: 12px;

    font-size: 13px;

    color: #62ff91;
}

.profile-status {

    margin-top: 10px;

    font-size: 13px;
}

.profile-created {

    color: #62ff91;
}

.profile-missing {

    color: #ffcc66;
}

.link {

    display: inline-block;

    margin-top: 12px;

    color: #ffffff;

    text-decoration: none;

    border-bottom: 1px solid #666;
}

.link:hover {

    border-color: #ffffff;
}

@media(max-width: 800px) {

    .grid {

        grid-template-columns: 1fr;
    }

    .full {

        grid-column: auto;
    }

    .hero h1 {

        font-size: 40px;
    }
}

</style>

</head>


<body>

<div class="app">


<header>

<div class="logo">
SAI
</div>

<div class="status">
● AI ONLINE
</div>

</header>


<section class="hero">

<h1>
Your personal AI agent.
</h1>

<p>
Learn. Build. Discover. Execute.
</p>

</section>


<div class="grid">


<!-- ======================================
     PROFILE
======================================= -->

<div class="card">

<h2>Your Profile</h2>

<input
    id="profileName"
    placeholder="Your name"
>

<br><br>

<input
    id="profileEmail"
    placeholder="Email"
    type="email"
>

<br><br>

<input
    id="profileGoal"
    placeholder="Your main goal"
>

<br><br>

<input
    id="profileSkills"
    placeholder="Skills — Python, C++, DSA"
>

<button
    class="primary"
    onclick="saveProfile()"
    id="profileButton"
>
Create / Update Profile
</button>

<div
    class="profile-status"
    id="profileStatus"
>
No profile loaded.
</div>

</div>


<!-- ======================================
     SAI CHAT
======================================= -->

<div class="card">

<h2>Talk to SAI</h2>

<textarea
    id="message"
    placeholder="Tell SAI what you want to accomplish..."
></textarea>

<button
    class="primary"
    onclick="askSAI()"
>
Ask SAI
</button>

<div
    class="result"
    id="chatResult"
>
SAI is ready.
</div>

</div>


<!-- ======================================
     GOALS
======================================= -->

<div class="card">

<h2>Your Goals</h2>

<input
    id="goalInput"
    placeholder="Add a goal..."
>

<button
    class="secondary"
    onclick="addGoal()"
>
Add Goal
</button>

<div id="goals">
Loading...
</div>

</div>


<!-- ======================================
     OPPORTUNITY ENGINE
======================================= -->

<div class="card full">

<h2>
Opportunity Engine
</h2>

<p class="muted">

Find opportunities matching your
interests, skills and goals.

</p>

<input
    id="opportunitySearch"
    placeholder="Leave empty for personalized results, or search Python, AI, internship..."
>

<button
    class="primary"
    onclick="searchOpportunities()"
>
Find Opportunities
</button>

<div id="opportunityMode"
     class="profile-status muted">
</div>

<div id="opportunities">
</div>

</div>


</div>

</div>


<script>


// ======================================
// STATE
// ======================================

let currentUserId =
    localStorage.getItem("sai_user_id");


// ======================================
// PROFILE
// ======================================

async function saveProfile() {

    const name =
        document
        .getElementById("profileName")
        .value
        .trim();

    const email =
        document
        .getElementById("profileEmail")
        .value
        .trim();

    const goal =
        document
        .getElementById("profileGoal")
        .value
        .trim();

    const skills =
        document
        .getElementById("profileSkills")
        .value
        .trim();

    const status =
        document
        .getElementById("profileStatus");


    if (!name) {

        status.textContent =
            "Name is required.";

        status.className =
            "profile-status profile-missing";

        return;
    }


    if (!email) {

        status.textContent =
            "Email is required.";

        status.className =
            "profile-status profile-missing";

        return;
    }


    try {

        const response =
            await fetch(
                "/api/profile",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            name,
                            email,
                            goal,
                            skills
                        })
                }
            );


        const data =
            await response.json();


        if (!data.success) {

            throw new Error(
                data.error ||
                "Profile could not be saved."
            );
        }


        currentUserId =
            String(data.user_id);


        localStorage.setItem(
            "sai_user_id",
            currentUserId
        );


        status.textContent =
            "Profile saved. User ID: "
            + currentUserId;

        status.className =
            "profile-status profile-created";


        await loadProfile();

        await searchOpportunities();

    }

    catch (error) {

        status.textContent =
            "Error: "
            + error.message;

        status.className =
            "profile-status profile-missing";
    }

}


// ======================================
// LOAD PROFILE
// ======================================

async function loadProfile() {

    if (!currentUserId) {

        return;
    }


    try {

        const response =
            await fetch(
                "/api/profile/"
                + encodeURIComponent(
                    currentUserId
                )
            );


        const data =
            await response.json();


        if (!data.success) {

            localStorage.removeItem(
                "sai_user_id"
            );

            currentUserId = null;

            return;
        }


        const profile =
            data.profile;


        document
        .getElementById("profileName")
        .value =
            profile.name || "";


        document
        .getElementById("profileEmail")
        .value =
            profile.email || "";


        document
        .getElementById("profileGoal")
        .value =
            profile.goal || "";


        document
        .getElementById("profileSkills")
        .value =
            profile.skills || "";


        const status =
            document
            .getElementById(
                "profileStatus"
            );


        status.textContent =
            "Profile loaded. User ID: "
            + currentUserId;

        status.className =
            "profile-status profile-created";


    }

    catch (error) {

        console.error(
            "Profile load error:",
            error
        );
    }

}


// ======================================
// CHAT
// ======================================

async function askSAI() {

    const message =
        document
        .getElementById("message")
        .value
        .trim();

    const output =
        document
        .getElementById("chatResult");


    if (!message) {

        output.textContent =
            "Tell SAI what you want to accomplish.";

        return;
    }


    output.textContent =
        "SAI is thinking...";


    try {

        const response =
            await fetch(
                "/api/chat",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            message
                        })
                }
            );


        const data =
            await response.json();


        if (!data.success) {

            throw new Error(
                data.error ||
                "SAI request failed."
            );
        }


        output.textContent =
            data.response;

    }

    catch (error) {

        output.textContent =
            "Error: "
            + error.message;
    }

}


// ======================================
// GOALS
// ======================================

async function loadGoals() {

    const container =
        document.getElementById(
            "goals"
        );


    try {

        const response =
            await fetch(
                "/api/goals"
            );


        const data =
            await response.json();


        if (!data.success) {

            throw new Error(
                data.error
            );
        }


        container.innerHTML = "";


        if (
            !data.goals ||
            data.goals.length === 0
        ) {

            container.innerHTML =
                '<div class="muted">'
                + "No goals yet."
                + "</div>";

            return;
        }


        data.goals.forEach(
            goal => {

                const div =
                    document
                    .createElement(
                        "div"
                    );

                div.className =
                    "goal";


                div.innerHTML =
                    "<strong>"
                    + safe(goal.title)
                    + "</strong>"
                    + "<div class='muted'>"
                    + safe(goal.status)
                    + "</div>";


                container.appendChild(
                    div
                );
            }
        );

    }

    catch (error) {

        container.textContent =
            "Could not load goals.";
    }

}


// ======================================
// ADD GOAL
// ======================================

async function addGoal() {

    const input =
        document
        .getElementById(
            "goalInput"
        );


    const goal =
        input.value.trim();


    if (!goal) {

        return;
    }


    try {

        const response =
            await fetch(
                "/api/goals",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            goal
                        })
                }
            );


        const data =
            await response.json();


        if (!data.success) {

            throw new Error(
                data.error
            );
        }


        input.value = "";

        await loadGoals();

    }

    catch (error) {

        alert(
            "Could not save goal: "
            + error.message
        );
    }

}


// ======================================
// OPPORTUNITIES
// ======================================

async function searchOpportunities() {

    const query =
        document
        .getElementById(
            "opportunitySearch"
        )
        .value
        .trim();


    const container =
        document
        .getElementById(
            "opportunities"
        );


    const mode =
        document
        .getElementById(
            "opportunityMode"
        );


    container.textContent =
        "Searching...";


    try {

        let url =
            "/api/opportunities";


        if (query) {

            url +=
                "?q="
                + encodeURIComponent(
                    query
                );

            mode.textContent =
                "Search results";

        }

        else if (currentUserId) {

            url +=
                "?user_id="
                + encodeURIComponent(
                    currentUserId
                );

            mode.textContent =
                "Personalized for your profile";

        }

        else {

            mode.textContent =
                "General opportunities";

        }


        const response =
            await fetch(url);


        const data =
            await response.json();


        if (!data.success) {

            throw new Error(
                data.error ||
                "Opportunity search failed."
            );
        }


        container.innerHTML = "";


        if (
            !data.opportunities ||
            data.opportunities.length === 0
        ) {

            container.innerHTML =
                '<div class="muted">'
                + "No matching opportunities."
                + "</div>";

            return;
        }


        data.opportunities.forEach(
            item => {

                const div =
                    document
                    .createElement(
                        "div"
                    );


                div.className =
                    "opportunity";


                let html =
                    "<h3>"
                    + safe(item.title)
                    + "</h3>";


                html +=
                    "<div class='muted'>"
                    + safe(item.company)
                    + "</div>";


                html +=
                    "<p>"
                    + safe(item.type)
                    + " · "
                    + safe(item.location)
                    + "</p>";


                if (
                    item.match_score !==
                    undefined
                ) {

                    html +=
                        "<div class='match'>"
                        + "Match score: "
                        + safe(
                            item.match_score
                        )
                        + "</div>";
                }


                if (
                    item.matched_skills &&
                    item.matched_skills.length
                ) {

                    html +=
                        "<div>";


                    item.matched_skills
                    .forEach(
                        skill => {

                            html +=
                                "<span class='badge'>"
                                + safe(skill)
                                + "</span>";
                        }
                    );


                    html +=
                        "</div>";
                }


                if (
                    item.skills &&
                    item.skills.length
                ) {

                    html +=
                        "<div class='muted'>"
                        + "Skills: "
                        + safe(
                            item.skills.join(
                                ", "
                            )
                        )
                        + "</div>";
                }


                if (item.url) {

                    html +=
                        "<a class='link' "
                        + "href='"
                        + safe(item.url)
                        + "' "
                        + "target='_blank' "
                        + "rel='noopener noreferrer'>"
                        + "Open opportunity"
                        + "</a>";
                }


                html +=
                    "<button "
                    + "class='secondary' "
                    + "onclick='saveOpportunity("
                    + JSON.stringify(
                        item
                    )
                    + ")'>"
                    + "Save"
                    + "</button>";


                div.innerHTML =
                    html;


                container.appendChild(
                    div
                );
            }
        );

    }

    catch (error) {

        container.textContent =
            "Search error: "
            + error.message;
    }

}


// ======================================
// SAVE OPPORTUNITY
// ======================================

async function saveOpportunity(
    opportunity
) {

    if (!currentUserId) {

        alert(
            "Create your profile first."
        );

        return;
    }


    try {

        const response =
            await fetch(
                "/api/applications",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            user_id:
                                Number(
                                    currentUserId
                                ),

                            opportunity_id:
                                opportunity.id,

                            title:
                                opportunity.title,

                            company:
                                opportunity.company,

                            url:
                                opportunity.url
                                || ""
                        })
                }
            );


        const data =
            await response.json();


        if (!data.success) {

            throw new Error(
                data.error ||
                "Could not save opportunity."
            );
        }


        alert(
            data.message
            || "Opportunity saved."
        );

    }

    catch (error) {

        alert(
            "Could not save opportunity: "
            + error.message
        );
    }

}


// ======================================
// SECURITY
// ======================================

function safe(value) {

    return String(
        value ?? ""
    )

    .replaceAll(
        "&",
        "&amp;"
    )

    .replaceAll(
        "<",
        "&lt;"
    )

    .replaceAll(
        ">",
        "&gt;"
    )

    .replaceAll(
        '"',
        "&quot;"
    )

    .replaceAll(
        "'",
        "&#039;"
    );
}


// ======================================
// INITIALIZE
// ======================================

async function initialize() {

    await loadProfile();

    await loadGoals();

    await searchOpportunities();
}


initialize();

</script>

</body>

</html>
